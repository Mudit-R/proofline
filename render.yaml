services:
  - type: web
    name: proofline
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: MODE
        value: external
      - key: HOST
        value: 0.0.0.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: CONTRACT_ADDRESS
        value: '0xb196Da6761E94bd4D805b2102BcbFCb3fD29c278'
      - key: PUBLIC_TRY
        value: 'true'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: CONFIRMATIONS
        value: '2'
      - key: REWARD_ETH
        value: '0.000001'
      - key: SESSION_SECRET
        generateValue: true
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: REQUESTER_KEY
        sync: false
      - key: WORKER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: proofline-db
          property: connectionString
databases:
  - name: proofline-db
    plan: free
    region: oregon
    databaseName: proofline
    user: proofline
