name: Proof and settlement checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run setup
      - run: npm run build
      - run: npm test
      - run: node scripts/verify-bundle.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proofline-verification-evidence
          path: docs/evidence/
